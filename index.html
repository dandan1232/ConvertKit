<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConvertKit - 在线文件格式转换工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 6v12M6 12h12"></path>
        </svg>
        <h1>ConvertKit</h1>
      </div>
      <p class="tagline">快速、安全的在线文件格式转换工具</p>
    </header>

    <main class="main">
      <div class="converter-card">
        <!-- 文件上传区域 -->
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" accept=".pdf,.md,.markdown,.txt,.html,.htm" hidden>
          <div class="upload-content">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p class="upload-text">拖拽文件到此处，或点击选择文件</p>
            <p class="upload-hint">可读取 PDF、Markdown、HTML、TXT</p>
          </div>
        </div>

        <!-- 文件信息显示 -->
        <div class="file-info" id="file-info" hidden>
          <div class="file-details">
            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
              <polyline points="13 2 13 9 20 9"></polyline>
            </svg>
            <div class="file-meta">
              <p class="file-name" id="file-name"></p>
              <p class="file-size" id="file-size"></p>
            </div>
            <button class="remove-file" id="remove-file" title="移除文件">✕</button>
          </div>
        </div>

        <!-- 格式选择 -->
        <div class="format-selector">
          <div class="format-group">
            <label>源格式</label>
            <div class="format-badge" id="source-format">自动检测</div>
          </div>

          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>

          <div class="format-group">
            <label for="target-format">目标格式</label>
            <select id="target-format" disabled>
              <option value="">-- 选择格式 --</option>
            </select>
          </div>
        </div>

        <!-- 转换按钮 -->
        <button class="convert-button" id="convert-button" disabled>
          <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          开始转换
        </button>

        <!-- 进度条 -->
        <div class="progress-container" id="progress-container" hidden>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="progress-text" id="progress-text">正在转换...</p>
        </div>

        <!-- 状态消息 -->
        <div class="status-message" id="status-message" hidden></div>
      </div>

      <!-- 功能说明 -->
      <div class="features">
        <div class="feature-card">
          <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <h3>本地处理</h3>
          <p>所有文件在您的浏览器中处理，不上传到服务器</p>
        </div>

        <div class="feature-card">
          <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <h3>快速转换</h3>
          <p>无需等待，即时完成格式转换</p>
        </div>

        <div class="feature-card">
          <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <h3>免费使用</h3>
          <p>完全免费，无需注册，无限次使用</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 ConvertKit | 本地运行，保护隐私</p>
      <div class="supported-formats">
        <span class="badge">PDF</span>
        <span class="badge">Markdown</span>
        <span class="badge">Word</span>
        <span class="badge">EPUB</span>
        <span class="badge">HTML</span>
        <span class="badge">TXT</span>
      </div>
    </footer>
  </div>

  <!-- 本地文件解析与生成库 -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
